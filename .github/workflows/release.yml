name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.2.4)'
        required: true
        default: '1.2.4'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "building version $v"

      # The core is not vendored in this repository (core-bin/ is ignored), so
      # the runner pulls the matching official bundle. Keep the pt helpers from
      # that bundle: Aether uses them for its Psiphon/Tor chained exits.
      - name: Fetch official Aether core
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path core-bin | Out-Null
          $tmp = Join-Path $env:RUNNER_TEMP 'core'
          $zip = Join-Path $env:RUNNER_TEMP 'core.zip'
          Invoke-WebRequest -Uri 'https://github.com/CluvexStudio/Aether/releases/download/v2.1.0/aether-windows-x86_64.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $exe = Get-ChildItem $tmp -Recurse -Filter 'aether.exe' | Select-Object -First 1
          if (-not $exe) { throw 'aether.exe not found in the official archive' }
          Copy-Item $exe.FullName -Destination 'core-bin\aether.exe' -Force

          $ptOut = 'core-bin\pt'
          New-Item -ItemType Directory -Force -Path $ptOut | Out-Null
          foreach ($name in @('psiphon-tunnel-core.exe', 'lyrebird.exe')) {
            $helper = Get-ChildItem $tmp -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $helper) { throw "$name not found in the official Aether archive" }
            Copy-Item $helper.FullName -Destination (Join-Path $ptOut $name) -Force
            Write-Host "staged $name"
          }

          & 'core-bin\aether.exe' --version
          Get-ChildItem 'core-bin' -Recurse -File | Select-Object FullName, Length

      - name: Fetch Wintun runtime
        shell: pwsh
        run: |
          $version = '0.14.1'
          $zip = Join-Path $env:RUNNER_TEMP "wintun-$version.zip"
          $tmp = Join-Path $env:RUNNER_TEMP "wintun-$version"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$version.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $dll = Get-ChildItem $tmp -Recurse -File -Filter 'wintun.dll' | Select-Object -First 1
          if (-not $dll) { throw 'wintun.dll not found in the official Wintun archive' }
          New-Item -ItemType Directory -Force -Path 'core-bin' | Out-Null
          Copy-Item $dll.FullName -Destination 'core-bin\wintun.dll' -Force
          Get-Item 'core-bin\wintun.dll' | Select-Object FullName, Length

      - name: Build, package and publish
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .\scripts\release.ps1 -Version '${{ steps.ver.outputs.version }}' -Token $env:GITHUB_TOKEN
